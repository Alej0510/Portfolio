<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
      .card {
      background-color: #050505;
      border: 1px solid #333;
      border-radius: 20px;
    }
    .logo-circle {
      background: radial-gradient(circle at center, #00BCD4 0%, #008899 100%);
      border: 1px solid rgba(0, 188, 212, 0.5);
      box-shadow: 0 0 40px rgba(0, 188, 212, 0.3);
    }
    .letter {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -2px;
    }
  </style>

  <!-- Card Background -->
  <rect width="100" height="100" rx="20" ry="20" class="card" />

  <!-- Circular Logo Area -->
  <circle cx="50" cy="50" r="42" class="logo-circle" />

  <!-- Initials -->
  <text x="50" y="63" class="letter" font-size="62" text-anchor="middle">AC</text>
</svg>